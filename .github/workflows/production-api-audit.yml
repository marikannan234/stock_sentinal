name: Production API Endpoint Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-endpoint-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Probe production GET endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check every documented GET route
        env:
          OPENAPI_URL: https://stock-sentinal-api.onrender.com/openapi.json
          API_BASE: https://stock-sentinal-api.onrender.com
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["API_BASE"].rstrip("/")
          openapi_url = os.environ["OPENAPI_URL"]

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "StockSentinel-Production-Audit"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          spec = get_json(openapi_url)
          paths = spec.get("paths", {})
          operations = []
          for path, methods in paths.items():
              if not isinstance(methods, dict) or "get" not in methods:
                  continue
              route = re.sub(r"\{([^}]+)\}", lambda m: {
                  "ticker": "AAPL", "symbol": "AAPL", "stock_symbol": "AAPL",
                  "alert_id": "1", "trade_id": "1", "ticket_id": "1", "id": "1",
              }.get(m.group(1), "1"), path)
              params = {}
              operation = methods["get"]
              for param in operation.get("parameters", []):
                  if param.get("in") != "query" or not param.get("required"):
                      continue
                  name = param["name"]
                  schema = param.get("schema", {})
                  if schema.get("enum"):
                      value = schema["enum"][0]
                  elif schema.get("type") == "integer":
                      value = "1"
                  elif schema.get("type") == "number":
                      value = "1"
                  elif schema.get("type") == "boolean":
                      value = "true"
                  elif name.lower() in ("symbol", "ticker", "stock_symbol"):
                      value = "AAPL"
                  elif name.lower() in ("period", "range"):
                      value = "1mo"
                  elif name.lower() == "interval":
                      value = "1d"
                  else:
                      value = "test"
                  params[name] = value
              url = base + route
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              operations.append((path, url, operation.get("operationId", "")))

          def probe(item):
              path, url, operation_id = item
              req = urllib.request.Request(url, headers={"User-Agent": "StockSentinel-Production-Audit"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      code = response.status
              except urllib.error.HTTPError as exc:
                  code = exc.code
              except Exception as exc:
                  return {"path": path, "operationId": operation_id, "status": "ERROR", "detail": str(exc)[:180]}
              # Unauthenticated requests should be rejected by protected endpoints;
              # validation/rate-limit responses still prove the route is reachable.
              ok = code in (200, 201, 204, 401, 403, 422, 429)
              return {"path": path, "operationId": operation_id, "status": code, "ok": ok}

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              results = list(pool.map(probe, operations))
          results.sort(key=lambda item: item["path"])
          for result in results:
              marker = "PASS" if result.get("ok") else "FAIL"
              print(f'{marker} {result["status"]} {result["path"]}' + (f' — {result["detail"]}' if "detail" in result else ""))
          passed = sum(bool(item.get("ok")) for item in results)
          failed = len(results) - passed
          print(f"\nSummary: {passed}/{len(results)} GET routes reachable; {failed} failures.")
          print("Note: unauthenticated probes do not validate successful authenticated business flows or mutation endpoints.")
          if failed:
              sys.exit(1)
          PY
