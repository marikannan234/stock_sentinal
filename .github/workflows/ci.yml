name: StockSentinel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run backend tests
        run: |
          python -m compileall -q app
          python -m pytest -q


  schema-migrations:
    name: Backend - Migration and Schema Drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocksentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocksentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/stocksentinel
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456789
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-only-password
      MAIL_FROM: ci@example.com
      BACKEND_CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply all migrations to a clean PostgreSQL database
        run: alembic upgrade head

      - name: Detect model/schema drift
        run: alembic check

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        env:
          # next.config.mjs requires this value when loading the config.
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Build
        run: npm run build
        env:
          # Placeholder origin; CI build output is not deployed.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t stocksentinel-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_WS_URL=ws://localhost:8000 \
            -t stocksentinel-frontend:${{ github.sha }} \
            ./frontend

      # To push images to a registry, add a login step and push:
      # - name: Log in to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
